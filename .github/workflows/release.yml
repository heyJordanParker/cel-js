name: Release

# Publishes the package to the public npm registry when a GitHub Release is
# published. The package name is scoped to the repository owner
# (`@heyjordanparker/cel-js`) because the bare `cel-js` name is owned upstream.
#
# npm trusts this workflow through trusted publishing (OIDC), so no npm token is
# stored anywhere. The package's settings on npmjs.com name this repository and
# `release.yml` as its trusted publisher. Trusted publishing needs npm 11.5.1 or
# later, and pnpm 10 does not support it, so pnpm installs and npm publishes.
#
# `dist/` is gitignored and never committed. It is built fresh here by the
# `prepack` lifecycle script that `npm publish` runs, and shipped inside the
# published tarball via the package's `files` allowlist.
#
# Cut a release with `pnpm release`: it bumps the version, commits, tags, pushes
# and publishes the GitHub Release, and this workflow does the rest.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm run type-check

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: npm publish --access public
