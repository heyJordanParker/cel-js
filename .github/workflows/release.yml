name: Release

# Publishes the package to the public npm registry when a GitHub Release is
# published. The package name is scoped to the repository owner
# (`@heyjordanparker/cel-js`) because the bare `cel-js` name is owned upstream.
#
# `dist/` is gitignored and never committed. It is built fresh here by the
# `prepack` lifecycle script that `pnpm publish` runs, and shipped inside the
# published tarball via the package's `files` allowlist.
#
# Cut a release by bumping the version, pushing a tag, and publishing a GitHub
# Release for that tag — this workflow does the rest.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
